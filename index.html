<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Image to Video (Kling)</title>
  <style>
    body{font-family:Arial;padding:16px;max-width:520px;margin:auto}
    button{padding:10px 14px;border:0;border-radius:10px;background:#2d5bff;color:#fff;font-weight:700}
    input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #ccc;margin:8px 0}
    video{width:100%;margin-top:12px;border-radius:12px;background:#000}
    .box{border:1px solid #ddd;padding:12px;border-radius:12px}
  </style>
</head>
<body>
  <h2>AI Image → Video (Kling via Replicate)</h2>

  <div class="box">
    <label><b>Upload Image</b></label>
    <input type="file" id="img" accept="image/*" />

    <label><b>Prompt</b></label>
    <textarea id="prompt" rows="3">Smooth cinematic camera motion, natural movement, realistic.</textarea>

    <button onclick="gen()">Generate Video</button>

    <p id="msg"></p>
    <video id="vid" controls></video>
  </div>

<script>
async function gen(){
  const file = document.getElementById("img").files[0];
  const prompt = document.getElementById("prompt").value.trim();
  const msg = document.getElementById("msg");
  const vid = document.getElementById("vid");

  if(!file){ msg.textContent="Please image select karo."; return; }

  msg.textContent="Uploading... AI generate ho rahi hai (time lag sakta hai)...";
  vid.removeAttribute("src"); vid.load();

  const fd = new FormData();
  fd.append("image", file);
  fd.append("prompt", prompt);

  const r = await fetch("/api/generate", { method:"POST", body: fd });
  const data = await r.json();

  if(!r.ok){
    msg.textContent="Error: " + (data.error || "Unknown");
    return;
  }

  msg.textContent="Done ✅ Video ready!";
  vid.src = data.url;
  vid.load();
}
</script>
</body>
</html>
